<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindmap: Project Management Manual (Design & Construction)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --accent: #f59e0b;
      --green: #10b981;
      --purple: #a855f7;
      --pink: #ec4899;
      --red: #ef4444;
      --node-hover: #273549;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .title-box h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-box p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .search-box {
      position: relative;
    }

    .search-input {
      background: #090d16;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 12px 6px 30px;
      color: #fff;
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      width: 280px;
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
    }

    .btn:hover {
      background: var(--card-border);
      color: var(--primary);
    }

    .btn-primary {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .btn-primary:hover {
      background: #0369a1;
    }

    #main-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    #tree-canvas {
      flex: 1;
      overflow: auto;
      padding: 40px;
      cursor: grab;
      user-select: none;
    }

    #tree-canvas:active {
      cursor: grabbing;
    }

    /* Mindmap Tree Styles */
    .tree {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 100%;
    }

    .node-group {
      display: flex;
      align-items: center;
      margin: 6px 0;
      position: relative;
    }

    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
      max-width: 480px;
    }

    .node-card:hover {
      background: var(--node-hover);
      border-color: var(--primary);
      transform: translateX(2px);
    }

    .node-card.root {
      background: linear-gradient(135deg, #0369a1, #1e293b);
      border: 2px solid var(--primary);
      font-size: 1.05rem;
      font-weight: 700;
      padding: 12px 20px;
      color: #fff;
    }

    .node-card.level-1 {
      border-left: 4px solid var(--accent);
      font-weight: 600;
      background: #182234;
    }

    .node-card.level-2 {
      border-left: 3px solid var(--primary);
      font-size: 0.85rem;
    }

    .node-card.level-3 {
      border-left: 2px solid var(--green);
      font-size: 0.82rem;
      color: #cbd5e1;
    }

    .toggle-icon {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      font-weight: 500;
    }

    .badge.red {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .badge.green {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }
    .badge.orange {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .children-container {
      margin-left: 28px;
      padding-left: 14px;
      border-left: 2px dashed rgba(100, 116, 139, 0.35);
      transition: all 0.25s ease-in-out;
    }

    .hidden {
      display: none !important;
    }

    .highlight {
      border-color: #f59e0b !important;
      background: rgba(245, 158, 11, 0.15) !important;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.5) !important;
    }

    /* Detail Inspector Drawer */
    #inspector {
      width: 360px;
      background: #111827;
      border-left: 1px solid var(--card-border);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    #inspector h2 {
      font-size: 1.05rem;
      color: var(--primary);
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
    }

    #inspector .desc-box {
      font-size: 0.85rem;
      line-height: 1.5;
      color: #cbd5e1;
    }

    #inspector .meta-tag {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: #1f2937;
      color: #93c5fd;
      display: inline-block;
      margin-right: 6px;
      margin-bottom: 6px;
    }
  </style>
</head>

            { title: "Thuê đơn vị thí nghiệm độc lập (Testing Agency) do Chủ đầu tư trả phí trực tiếp", level: 2 }
          ]
        },
        {
          title: "6. Quản lý Ngân sách (Budgeting)",
          level: 1,
          badge: "Chương 6",
          desc: "Kiểm soát chi phí liên tục qua các giai đoạn.",
          children: [
            { title: "Vòng đời cập nhật: Predesign → SD Budget → DD Budget → CD Budget → Construction Budget", level: 2 },
            { title: "Sử dụng biểu mẫu MnSCU Project Budget Worksheet đối chiếu qua từng mốc", level: 2 }
          ]
        },
        {
          title: "7. Quản lý Tiến độ (Scheduling)",
          level: 1,
          badge: "Chương 7",
          desc: "Bắt buộc tuân thủ phương pháp đường găng CPM.",
          children: [
            { title: "Tiến độ lập theo định dạng CPM (Critical Path Method)", level: 2, badge: "Chuẩn CPM" },
            { title: "Nhà thầu nộp tiến độ chi tiết trong 10 ngày sau NTP", level: 2 },
            { title: "Cập nhật tiến độ hàng tháng kèm theo mỗi hồ sơ đề nghị thanh toán (Pay Application)", level: 2 }
          ]
        },
        {
          title: "8. Quản lý Tài chính & Kế toán (Financial Management)",
          level: 1,
          badge: "Chương 9",
          children: [
            { title: "Thiết lập mã số kế toán MAPS (Appropriation, ORG #, Allotment)", level: 2 },
            { title: "Dự phòng xây lắp (Construction Contingency): 5% (công trình mới), 10% (cải tạo)", level: 2, badge: "5-10%" },
            { title: "Nội thất & Thiết bị (FF&E): Phải phối hợp chặt chẽ về diện tích, điện, dữ liệu mạng để tránh phát sinh", level: 2 }
          ]
        },
        {
          title: "9. Phụ lục Biểu mẫu & Hợp đồng (Appendix & Forms)",
          level: 1,
          badge: "93 Biểu mẫu",
          desc: "Đóng gói 93 biểu mẫu chuẩn hóa theo từng giai đoạn.",
          children: [
            { title: "Giai đoạn Thiết kế: SD Checklist, Budget Worksheet, Schedule Milestones, SD Approval Letter", level: 2 },
            { title: "Giai đoạn Đấu thầu: Division 0, Non-Responsible Bidder, Vendor Preference", level: 2 },
            { title: "Giai đoạn Thi công: RFI Form, CCD (MnSCU 014), CO (MnSCU 022), Pay App (MnSCU 060)", level: 2 },
            { title: "Giai đoạn Bàn giao: 10-Month Checklist, Substantial Completion Checklist, POE Form", level: 2 }
          ]
        }
      ]
    };

    let globalCollapsed = false;

    function renderNode(item) {
      const group = document.createElement("div");
      group.className = "node-group-container";

      const nodeRow = document.createElement("div");
      nodeRow.className = "node-group";

      const card = document.createElement("div");
      card.className = `node-card ${item.level === 0 ? 'root' : 'level-' + Math.min(item.level, 3)}`;
      
      const hasChildren = item.children && item.children.length > 0;
      
      if (hasChildren) {
        const toggle = document.createElement("div");
        toggle.className = "toggle-icon";
        toggle.innerText = "▼";
        card.appendChild(toggle);
      }

      const text = document.createElement("span");
      text.className = "node-title";
      text.innerText = item.title;
      card.appendChild(text);

      if (item.badge) {
        const badge = document.createElement("span");
        badge.className = "badge";
        if (item.badge.includes("10") || item.badge.includes("Rất quan trọng")) badge.classList.add("orange");
        if (item.badge.includes("Bắt buộc")) badge.classList.add("red");
        if (item.badge.includes("CPM") || item.badge.includes("D-B-B")) badge.classList.add("green");
        badge.innerText = item.badge;
        card.appendChild(badge);
      }

      // Click to inspect
      card.addEventListener("click", (e) => {
        e.stopPropagation();
        document.querySelectorAll(".node-card").forEach(c => c.classList.remove("highlight"));
        card.classList.add("highlight");
        showInspector(item);
      });

      nodeRow.appendChild(card);
      group.appendChild(nodeRow);

      if (hasChildren) {
        const childrenContainer = document.createElement("div");
        childrenContainer.className = "children-container";

        // Click toggle to collapse/expand
        card.querySelector(".toggle-icon").addEventListener("click", (e) => {
          e.stopPropagation();
          const isHidden = childrenContainer.classList.toggle("hidden");
          card.querySelector(".toggle-icon").innerText = isHidden ? "▶" : "▼";
        });

        item.children.forEach(child => {
          childrenContainer.appendChild(renderNode(child));
        });

        group.appendChild(childrenContainer);
      }

      return group;
    }

    function showInspector(item) {
      const container = document.getElementById("inspectorContent");
      container.innerHTML = `
        <h3 style="color: #f1f5f9; margin-bottom: 8px; font-size: 1rem;">${item.title}</h3>
        <div style="margin-bottom: 12px;">
          ${item.badge ? `<span class="meta-tag">🏷️ ${item.badge}</span>` : ''}
          <span class="meta-tag">Cấp độ: Level ${item.level}</span>
        </div>
        <p style="margin-bottom: 14px; line-height: 1.6;">${item.desc || 'Hạng mục chi tiết thuộc quy trình quản lý dự án theo chuẩn MnSCU.'}</p>
        ${item.children ? `<p style="font-size: 0.8rem; color: #94a3b8;">Số nhánh con: <strong>${item.children.length}</strong> nhánh</p>` : ''}
      `;
    }

    // Build tree
    const rootEl = document.getElementById("treeRoot");
    rootEl.appendChild(renderNode(data));

    // Expand / Collapse all
    document.getElementById("expandAllBtn").addEventListener("click", () => {
      document.querySelectorAll(".children-container").forEach(c => c.classList.remove("hidden"));
      document.querySelectorAll(".toggle-icon").forEach(t => t.innerText = "▼");
    });

    document.getElementById("collapseAllBtn").addEventListener("click", () => {
      document.querySelectorAll(".children-container").forEach((c, idx) => {
        if (idx > 0) c.classList.add("hidden");
      });
      document.querySelectorAll(".toggle-icon").forEach((t, idx) => {
        if (idx > 0) t.innerText = "▶";
      });
    });

    // Search filter
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        document.querySelectorAll(".node-card").forEach(c => c.classList.remove("highlight"));
        return;
      }
      document.querySelectorAll(".node-card").forEach(c => {
        const title = c.innerText.toLowerCase();
        if (title.includes(q)) {
          c.classList.add("highlight");
          // expand parents
          let parent = c.closest(".children-container");
          while (parent) {
            parent.classList.remove("hidden");
            const toggle = parent.parentElement.querySelector(".toggle-icon");
            if (toggle) toggle.innerText = "▼";
            parent = parent.parentElement.closest(".children-container");
          }
        } else {
          c.classList.remove("highlight");
        }
      });
    });
  </script>
</body>
</html>
